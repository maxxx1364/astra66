name: compression-study

# Does volatility compression actually precede explosive moves?
#
# This is the base-rate study behind docs/FRICTION.md's conclusion: the current
# payoff profile (avg win ~1.1R) cannot survive a ~0.46R round trip on Wallex —
# it would need a 71% win rate.  The escape is a bigger average win, and the
# candidate mechanism is "coins coiled in a range that then break out".
#
# The question is therefore one number: among compressed coins, how often does
# a >=5R move follow, versus unconditionally?  That is a BASE RATE, so it needs
# a wide universe and a control -- not a backtest of a tuned strategy.
#
# No API key: klines are public market data, served from the Binance vision
# archive (one ZIP per month with a published SHA256).
#
# Sandbox note: this job exists because the research sandbox has no route to
# api.binance.com or data.binance.vision.  Runners do.

on:
  # A branch other than the default cannot be dispatched through the API
  # (GitHub only registers workflow_dispatch from the default branch), so the
  # push trigger is what lets this be exercised from a working branch.  The
  # paths filter keeps it from firing on unrelated commits.
  push:
    branches: ["arena/**"]
    paths:
      - ".github/workflows/compression-study.yml"
      - "tbae/scripts/compression_study.py"
      - "tbae/engine/**"
  workflow_dispatch:
    inputs:
      symbols:
        description: "Comma-separated USDT pairs to study"
        default: "BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,DOTUSDT,LTCUSDT,TRXUSDT,ATOMUSDT,NEARUSDT,APTUSDT,ARBUSDT,OPUSDT,INJUSDT,SUIUSDT,TIAUSDT,FILUSDT,ETCUSDT,UNIUSDT,AAVEUSDT"
      months:
        description: "Months of 1m history per symbol"
        default: "18"
      tf:
        description: "Study timeframe in minutes"
        default: "15"
      horizon:
        description: "Forward bars over which the move must happen"
        default: "40"
      min_bars:
        description: "Bars a coin must stay coiled to count"
        default: "6"
  schedule:
    - cron: "41 5 * * 2"        # Tuesdays 05:41 UTC, offset from backtest.yml

permissions:
  contents: write

concurrency:
  group: compression-study
  cancel-in-progress: false

jobs:
  study:
    name: compression -> breakout base rate
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tbae/requirements.txt

      - name: Install
        run: pip install -r requirements.txt
        working-directory: tbae

      - name: Prepare directories
        run: mkdir -p ../reports data/binance
        working-directory: tbae

      - name: Compute the window
        id: window
        run: |
          # Vision publishes one ZIP per month; asking for the current month
          # gets a 404, so the window always ends with the last closed month.
          END=$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m-%d)
          START=$(date -u -d "$END -${{ github.event.inputs.months || '18' }} months +1 day" +%Y-%m-%d)
          echo "start=$START" >> "$GITHUB_OUTPUT"
          echo "end=$END"     >> "$GITHUB_OUTPUT"
          echo "window: $START .. $END"

      - name: Probe the archive
        id: probe
        continue-on-error: true
        run: |
          python - <<'PY'
          import time, urllib.request
          hosts = {
              "vision_archive": "https://data.binance.vision/?prefix=data/spot/monthly/klines/BTCUSDT/1m/&delimiter=/",
              "rest_mirror": "https://data-api.binance.vision/api/v3/ping",
          }
          for name, url in hosts.items():
              t0 = time.time()
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "tbae-ci/1.0"})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      r.read(200)
                  print(f"OK   {name} ({time.time()-t0:.2f}s)")
              except Exception as e:
                  print(f"FAIL {name}: {type(e).__name__}: {str(e)[:140]}")
          PY
        working-directory: tbae

      # One ZIP per symbol-month.  24 symbols x 18 months = 432 requests, which
      # is the whole point of using vision instead of REST paging (~1600 per
      # symbol for the same history).
      #
      # Everything below is captured to a file and committed, because the
      # research sandbox has no route to results-receiver.actions.githubusercontent.com
      # or to the artifact blob store — a job log cannot be read back from it.
      - name: Download the universe
        id: download
        continue-on-error: true
        run: |
          set +e
          {
            echo "### runner clock: $(date -u)"
            echo "### window: ${{ steps.window.outputs.start }} .. ${{ steps.window.outputs.end }}"
            echo
            echo "### fetch_binance.py"
            python scripts/fetch_binance.py \
              --symbols "${{ github.event.inputs.symbols || 'BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT' }}" \
              --interval 1m \
              --start "${{ steps.window.outputs.start }}" \
              --end   "${{ steps.window.outputs.end }}" \
              --source vision --store --gzip --mirror \
              --out-dir data/binance \
              --json ../reports/fetch_report.json 2>&1
            echo "### exit=$?"
            echo
            echo "### data/binance"
            ls -lh data/binance 2>&1 | tail -40
            echo
            echo "### fetch_report.json"
            cat ../reports/fetch_report.json 2>&1 | head -c 4000
          } 2>&1 | tee ../reports/01_download.txt
        working-directory: tbae

      - name: Run the base-rate study
        id: study
        continue-on-error: true
        run: |
          set +e
          python scripts/compression_study.py \
            --feeds-dir data/binance \
            --tf "${{ github.event.inputs.tf || '15' }}" \
            --horizon "${{ github.event.inputs.horizon || '40' }}" \
            --min-bars "${{ github.event.inputs.min_bars || '6' }}" \
            --profile \
            --json ../reports/compression_study.json \
            2>&1 | tee ../reports/compression_study.txt
          echo "### exit=$?"
        working-directory: tbae

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Compression -> breakout base rate"
            echo
            echo "universe: \`${{ github.event.inputs.symbols || 'BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT' }}\`"
            echo "· window: \`${{ steps.window.outputs.start }}\` .. \`${{ steps.window.outputs.end }}\`"
            echo "· tf \`${{ github.event.inputs.tf || '15' }}m\` · horizon \`${{ github.event.inputs.horizon || '40' }}\` bars"
            echo
            echo '```'
            cat ../reports/compression_study.txt 2>/dev/null || echo "(study did not produce output)"
            echo '```'
            echo
            echo "> MFE is a ceiling, not a captured return. The lift only earns"
            echo "> anything if a trailing stop can hold on to a large slice of it."
          } >> "$GITHUB_STEP_SUMMARY"

      # Committed to *this* branch, not only main: the only channel the
      # research sandbox can actually read results back through is git.
      - name: Publish the report
        if: always()
        run: |
          set -e
          stamp=$(date -u +%Y-%m-%dT%H%M%SZ)
          mkdir -p tbae/docs/results/compression
          cp reports/compression_study.json "tbae/docs/results/compression/${stamp}.json" 2>/dev/null || true
          cp reports/compression_study.txt  "tbae/docs/results/compression/${stamp}.txt"  2>/dev/null || true
          cp reports/compression_study.txt  tbae/docs/results/compression/LATEST.txt      2>/dev/null || true
          cp reports/01_download.txt        tbae/docs/results/compression/DOWNLOAD.txt    2>/dev/null || true
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tbae/docs/results/compression
          if git diff --cached --quiet; then
            echo "report unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "research: compression base-rate study ${stamp} [skip ci]"
          git push origin HEAD:"${GITHUB_REF#refs/heads/}"
        working-directory: "."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compression-study
          path: reports/
          if-no-files-found: warn
          retention-days: 90
