name: backtest

# Three jobs, in order of how much they need the outside world:
#
#   tests              no network.  Installs exactly what requirements.txt
#                      declares and runs the suite — this is what caught the
#                      missing python-multipart dependency.
#   research-synthetic no network.  Reproduces the cost-attribution study from
#                      the deterministic generator, so a regression in the
#                      research code can never hide behind an exchange outage.
#   research-real      downloads Binance klines INSIDE the runner (runners have
#                      the internet route this sandbox does not) and runs the
#                      strategy against them.
#
# The real-data job is self-contained on purpose: it uses only modules that
# already exist on main (engine.feeds + app.cli), so it cannot fail because a
# script was not committed.  Every step that depends on a third party is
# `continue-on-error`, and the last step always writes an unambiguous ✅/❌ to
# the job summary — a green tick on the run page must never be mistaken for
# "real data was analysed".

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"        # Mondays 03:17 UTC
  workflow_dispatch:
    inputs:
      symbols:
        description: "Comma-separated symbols"
        default: "BTCUSDT,ETHUSDT,XRPUSDT,SOLUSDT"
      days:
        description: "Days of 1m history to download"
        default: "1095"
      tf:
        description: "Timeframe (minutes)"
        default: "60"
      window:
        description: "Synthetic study window (days)"
        default: "90"
      run_real_data:
        description: "Download real data (slower)"
        type: boolean
        default: true

concurrency:
  group: backtest-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # push/schedule events carry no inputs, so these fallbacks decide what those
  # runs study.  They match the workflow_dispatch defaults (1095d / 60m / 90d)
  # so that a run triggered by editing this file publishes the SAME
  # configuration as a manual run, instead of silently falling back to an older
  # study and overwriting LATEST.md with it.
  #
  # Symbols: a PR or push run is a regression check — one symbol, short window,
  # so that editing this file cannot spend forty minutes downloading.  The
  # scheduled and manual runs are the study itself.
  SYMBOLS: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'BTCUSDT' || (github.event.inputs.symbols || 'BTCUSDT,ETHUSDT,XRPUSDT,SOLUSDT') }}
  # Three years is the point: at ~107 trades per symbol-year the study sat at
  # n=427 against the ~569 needed for 80% power, and adding symbols to a single
  # year buys less than adding regimes.  The store makes it affordable — the
  # vision archive serves one ZIP per month, and --append means only the first
  # run pays for the history.
  DAYS: ${{ github.event_name == 'pull_request' && '14' || (github.event_name == 'push' && '90' || (github.event.inputs.days || '1095')) }}
  TF: ${{ github.event.inputs.tf || '60' }}
  WINDOW: ${{ github.event_name == 'pull_request' && '14' || (github.event.inputs.window || '90') }}
  SEEDS_SYNTH: ${{ github.event_name == 'pull_request' && '4' || '20' }}

jobs:
  # ---------------------------------------------------------------- tests ---
  tests:
    name: tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: tbae/requirements.txt

      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: tbae

      - name: Pytest
        run: python -m pytest -q --no-header -p no:warnings
        working-directory: tbae

      - name: API imports cleanly
        run: python -c "import app.main; print('routes:', len(app.main.app.routes))"
        working-directory: tbae

  # --------------------------------------------------- synthetic research ---
  research-synthetic:
    name: research (synthetic)
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tbae/requirements.txt

      - name: Install
        run: pip install -r requirements.txt
        working-directory: tbae

      - name: Prepare output directories
        run: mkdir -p ../reports
        working-directory: tbae

      - name: Entry A/B against controls
        run: |
          python -m app.cli compare --tf "$TF" --days "$WINDOW" --seed 7 \
            --json ../reports/synthetic_compare.json
        working-directory: tbae

      - name: Cost attribution
        run: |
          python scripts/cost_attribution.py \
            --seeds "$SEEDS_SYNTH" --days "$WINDOW" --tf "$TF" \
            --n-boot 1000 --json ../reports/synthetic_cost_attribution.json
        working-directory: tbae

      - name: Summary
        run: |
          {
            echo "## Synthetic research"
            echo
            echo "Seeds: \`$SEEDS_SYNTH\` · window: \`$WINDOW\`d · tf: \`$TF\`m"
            echo
            echo "| study | file |"
            echo "|---|---|"
            for f in ../reports/synthetic_*.json; do
              echo "| $(basename "$f") | artifact \`synthetic-reports\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-reports
          path: reports/
          if-no-files-found: error

  # ------------------------------------------------------- real research ---
  research-real:
    name: research (real Binance data)
    needs: tests
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_real_data != 'false' }}
    runs-on: ubuntu-latest
    # Raised from 60 -> 90 for the 4-symbol default.  The compute is cheap
    # (measured on a full 365d/60m year: compare 12s + 5-point sweep 14s +
    # ablation 21s = ~47s per symbol, so ~3min for four), but the kline
    # download is ~525k one-minute bars per symbol over the public mirror and
    # it scales linearly.  90 minutes leaves headroom for a slow mirror
    # instead of having the job killed mid-download.
    timeout-minutes: 90
    continue-on-error: true
    permissions:
      contents: write        # only this job needs it, to commit the report back
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tbae/requirements.txt

      - name: Install
        run: pip install -r requirements.txt
        working-directory: tbae

      # The previous version died here in 11s: the probe piped into
      # `tee ../reports/reachability.txt` before that directory existed, so tee
      # exited 1 and every later step was skipped — while `continue-on-error`
      # still showed the whole run as green.  Creating the directories first is
      # the fix; each writer also creates them again, defensively.
      - name: Prepare output directories
        run: mkdir -p ../reports data/binance
        working-directory: tbae

      - name: Probe exchange reachability
        run: |
          python - <<'PY'
          import json, os, time, urllib.request

          os.makedirs("../reports", exist_ok=True)
          hosts = {
              "rest": "https://api.binance.com/api/v3/ping",
              "rest_mirror": "https://data-api.binance.vision/api/v3/ping",
              "vision_archive": "https://data.binance.vision/?prefix=data/spot/monthly/klines/BTCUSDT/1m/&delimiter=/",
          }
          lines, ok = [], {}
          for name, url in hosts.items():
              t0 = time.time()
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "tbae-ci/1.0"})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      r.read(200)
                  ok[name] = True
                  lines.append(f"OK   {name} ({time.time()-t0:.2f}s)")
              except Exception as e:
                  ok[name] = False
                  lines.append(f"FAIL {name}: {type(e).__name__}: {str(e)[:140]}")
          text = "\n".join(lines)
          print(text)
          with open("../reports/reachability.txt", "w") as fh:
              fh.write(text + "\n")
          with open("../reports/reachability.json", "w") as fh:
              json.dump(ok, fh, indent=2)
          PY
        working-directory: tbae

      # ---------------------------------------------------------------- #
      # The store: restore -> top up -> save.
      #
      # A three-year 1-minute history per symbol is ~1.6M bars.  Downloading
      # that from scratch on every run costs ~1,600 REST requests per symbol
      # and dominated the job.  Two things fix it:
      #
      #   * the vision archive serves one ZIP per month with a published
      #     SHA256, so the same history is ~36 requests instead of ~1,600;
      #   * the store survives between runs (Actions cache, seeded on a cold
      #     cache from the `klines` release), and `--append` fetches only the
      #     contiguous block after the last bar already on disk.
      #
      # So the first run of a symbol costs years of requests and every run
      # after that costs days.
      # ---------------------------------------------------------------- #
      # Cache keys may not contain commas, so the symbol set is joined with
      # dashes.  The window length is part of the key too: a 14-day PR check
      # must not restore a three-year store and silently study the wrong range.
      - name: Compute the store key
        id: storekey
        run: |
          key="klines-v1-$(echo "$SYMBOLS" | tr ',' '-' | tr -d ' ')-${DAYS}d"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "store key: $key"

      - name: Restore the kline store
        id: store
        uses: actions/cache/restore@v4
        with:
          # Stamped with the run id because cache entries are immutable: each
          # run writes a NEW entry and restores the newest one via
          # restore-keys.  Unused entries are evicted after 7 days, which
          # bounds total growth at roughly a week of runs.
          path: tbae/data/binance
          key: ${{ steps.storekey.outputs.key }}-${{ github.run_id }}
          restore-keys: |
            ${{ steps.storekey.outputs.key }}-

      - name: Seed the store from the klines release
        if: steps.store.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Cold cache (first run, or after eviction): pull the published
          # snapshot instead of rebuilding years of history.  This is the
          # other half of the hybrid: the bulk lives in a release, and CI
          # only ever tops it up.
          mkdir -p tbae/data/binance
          if ! gh release view klines --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "no 'klines' release yet — the store will be built from scratch"
            exit 0
          fi
          gh release download klines --repo "$GITHUB_REPOSITORY" \
            --dir tbae/data/binance --pattern "*_1m.csv.gz" || true
          ls -lh tbae/data/binance || true

      # Klines are public market data: no API key.  If BINANCE_API_KEY is set as
      # a repository secret it is picked up automatically (higher rate limit).
      - name: Top up the kline store
        id: download
        continue-on-error: true
        run: |
          # --append is what keeps this cheap: only the block after the last
          # stored bar is fetched, so a warm cache makes this a no-op.
          if ! python scripts/fetch_binance.py \
                --symbols "$SYMBOLS" --interval 1m --days "$DAYS" \
                --source auto --store --append --gzip --mirror \
                --out-dir data/binance --json ../reports/fetch_report.json; then
            echo "vision archive failed — falling back to REST paging on the mirror"
            python scripts/fetch_binance.py \
                --symbols "$SYMBOLS" --interval 1m --days "$DAYS" \
                --source rest --store --append --gzip --mirror \
                --out-dir data/binance --json ../reports/fetch_report.json
          fi
          ls -lh data/binance
        working-directory: tbae

      - name: Locate each symbol's store
        id: locate
        run: |
          python - <<'PY'
          import glob, json, os
          paths = {}
          for sym in os.environ["SYMBOLS"].split(","):
              sym = sym.strip().upper()
              if not sym:
                  continue
              hits = sorted(glob.glob(f"data/binance/{sym}_1m.csv*"))
              if not hits:
                  print(f"::warning::no store found for {sym}")
                  continue
              paths[sym] = hits[-1]
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"paths={json.dumps(paths)}\n")
          print(json.dumps(paths, indent=2))
          PY
        working-directory: tbae

      # Every module used here is committed and unit-tested, so this cannot
      # break because a helper script was left uncommitted.  Costs are measured
      # from each symbol's own candles (ADV and the tick-implied spread floor)
      # rather than taken from the shared placeholders, so the four symbols are
      # compared on their own liquidity instead of a single assumed one.
      - name: Research on real data
        continue-on-error: true
        run: |
          status=0
          python - <<'PY' > /tmp/paths.sh
          import json, os
          paths = json.loads(os.environ.get("PATHS") or "{}")
          for sym, path in paths.items():
              print(f'PATH_{sym}="{path}"')
          PY
          . /tmp/paths.sh
          for SYM in $(echo "$SYMBOLS" | tr ',' ' '); do
            eval "CSV=\$PATH_${SYM}"
            if [ -z "$CSV" ] || [ ! -s "$CSV" ]; then echo "skip $SYM (no data file)"; continue; fi
            echo "=== $SYM: compare vs controls ==="
            python -m app.cli compare --feed "csv:$CSV" --tf "$TF" \
              --json "../reports/real_compare_${SYM}.json" || status=1
            echo "=== $SYM: confirmation-threshold sweep ==="
            python -m app.cli sweep --feed "csv:$CSV" --tf "$TF" \
              --param min_edge_score --grid 0.45,0.6,0.75,0.8,0.85 \
              --json "../reports/real_sweep_${SYM}.json" || status=1
            echo "=== $SYM: filter ablation ==="
            python -m app.cli ablation --feed "csv:$CSV" --tf "$TF" \
              --json "../reports/real_ablation_${SYM}.json" || status=1
          done
          exit $status
        working-directory: tbae
        env:
          PATHS: ${{ steps.locate.outputs.paths }}

      # Written back every run, not only on success: the expensive part is the
      # download, and a study that failed downstream has still already paid for
      # it.  Skipping the save on failure would make the next run re-download.
      - name: Save the kline store
        if: always() && steps.download.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: tbae/data/binance
          key: ${{ steps.storekey.outputs.key }}-${{ github.run_id }}

      - name: Job summary (always, and always unambiguous)
        if: always()
        run: |
          python - <<'PY'
          import glob, json, os

          rep = "../reports"
          summary = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null")

          def load(path):
              try:
                  with open(path) as fh:
                      return json.load(fh)
              except Exception:
                  return None

          def num(x, fmt="{:+.4f}"):
              try:
                  v = float(x)
              except (TypeError, ValueError):
                  return "—"
              return "—" if v != v else fmt.format(v)

          L = ["## Real-data research", ""]
          reach = os.path.join(rep, "reachability.txt")
          if os.path.exists(reach):
              L += ["### Exchange reachability from this runner", "```",
                    open(reach).read().strip(), "```", ""]
          qc = load(os.path.join(rep, "data_qc.json")) or {}
          # A grid point (or a symbol) below this many trades cannot support a
          # Sharpe or plateau reading.  Such rows are still printed — the shape
          # of the curve matters — but they are flagged and excluded from the
          # filtered plateau pick below.
          MIN_TRADES = 30
          POWER_N = 569          # trades for 80% power at 0.10R (see MDE study)
          pooled = []

          compares = sorted(glob.glob(os.path.join(rep, "real_compare_*.json")))
          if not compares:
              L += ["> ### ❌ Real-data study did NOT run",
                    ">",
                    "> No `real_compare_*.json` was produced.  Read the",
                    "> *Probe exchange reachability* and *Download klines* steps:",
                    "> HTTP 451 means the runner's IP range is geo-blocked by the",
                    "> venue, and nothing here can fix that from CI.",
                    ""]
              print("::error::real-data study produced no reports — see the job summary "
                    "(the green tick comes from continue-on-error, not from success)")
          else:
              L += ["> ### ✅ Real-data study completed", ""]
              for path in compares:
                  sym = os.path.basename(path)[len("real_compare_"):-len(".json")]
                  d = load(path)
                  if not d:
                      continue
                  L += [f"### {sym}", ""]
                  q = qc.get(sym) or {}
                  if q:
                      L += [f"Data: **{q.get('bars', 0):,}** minutes "
                            f"({q.get('covered_days')} of {q.get('requested_days')} days requested) · "
                            f"{q.get('first')} .. {q.get('last')} · "
                            f"missing {q.get('missing_minutes')} min ({q.get('missing_pct')}%) · "
                            f"source `{q.get('source')}`", ""]
                  man = strat.get("manifest") or {}
                  cm = man.get("costs") or {}
                  ccal = man.get("cost_calibration") or {}
                  if cm:
                      adv = ccal.get("adv_notional")
                      L += [f"Costs: fee {num(cm.get('commission_bps'))}/{num(cm.get('maker_bps'))} bp "
                            f"(taker/maker) · slippage {num(cm.get('slippage_bps'))} bp · "
                            f"ADV {('%.3g' % adv) if adv else '—'} "
                            f"({'measured' if 'adv_notional' in (ccal.get('measured') or []) else 'PLACEHOLDER'})"
                            + (f" · tick {ccal.get('tick_size')}" if ccal.get("tick_size") else ""), ""]
                  comp = d.get("comparison") or {}
                  L += ["| configuration | trades | return% | Sharpe | maxDD% | win% | E[R] | PF |",
                        "|---|---:|---:|---:|---:|---:|---:|---:|"]
                  for r in comp.get("rows") or []:
                      L.append(f"| {r.get('label')} | {r.get('n_trades')} | "
                               f"{num(r.get('return_pct'), '{:+.2f}')} | {num(r.get('sharpe'), '{:+.2f}')} | "
                               f"{num(r.get('max_dd_pct'), '{:.2f}')} | "
                               f"{num((r.get('win_rate') or 0) * 100, '{:.1f}')} | "
                               f"{num(r.get('expectancy_r'))} | {num(r.get('profit_factor'), '{:.2f}')} |")
                  L += ["", f"**verdict:** `{comp.get('verdict')}`", ""]
                  strat = d.get("strategy") or {}
                  tr = ((strat.get("metrics") or {}).get("trades") or {})
                  if tr:
                      L += [f"Decomposition (cash): gross {num(tr.get('gross_pnl_total'), '{:+,.0f}')} − "
                            f"friction {num(tr.get('friction_total'), '{:,.0f}')} = "
                            f"net {num(tr.get('net_pnl_total'), '{:+,.0f}')} · "
                            f"E[R] {num(tr.get('expectancy_r'))} · n={tr.get('n')}", ""]
                  funnel = strat.get("entry_funnel") or {}
                  if funnel:
                      L += [f"Entry funnel: {funnel.get('signals_emitted')} signals → "
                            f"{funnel.get('orders_filled')} fills → "
                            f"{funnel.get('positions_opened')} positions "
                            f"(fill rate {num(funnel.get('fill_rate'), '{:.2f}')})", ""]
                  ae = strat.get("accounting_errors") or []
                  L += [f"Accounting errors: **{len(ae)}** "
                        f"({'net == gross − costs holds on every trade' if not ae else str(ae[:2])})", ""]
                  n = tr.get("n") or 0
                  if n < 200:
                      L += [f"> ⚠️ n={n} is far below the ~569 trades needed for 80% power at "
                            "0.10R. Treat every number above as descriptive, not as evidence.", ""]

                  pooled.append({
                      "sym": sym,
                      "n": tr.get("n") or 0,
                      "expectancy_r": tr.get("expectancy_r"),
                      "win_rate": tr.get("win_rate"),
                      "gross": tr.get("gross_pnl_total") or 0.0,
                      "friction": tr.get("friction_total") or 0.0,
                      "net": tr.get("net_pnl_total") or 0.0,
                      "return_pct": ((strat.get("metrics") or {}).get("returns") or {}).get("total_return_pct"),
                      "max_dd_pct": ((strat.get("metrics") or {}).get("risk") or {}).get("max_drawdown_pct"),
                      "signals": funnel.get("signals_emitted") or 0,
                      "fills": funnel.get("orders_filled") or 0,
                      "accounting_errors": len(ae),
                      "verdict": comp.get("verdict"),
                  })

                  sw = load(os.path.join(rep, f"real_sweep_{sym}.json"))
                  if sw:
                      srows = sw.get("rows") or []
                      thin = [r for r in srows if (r.get("trades") or 0) < MIN_TRADES]
                      L += [f"#### {sym} — confirmation-threshold sweep", "",
                            "| min_edge_score | trades | return% | Sharpe | maxDD% | E[R] |",
                            "|---:|---:|---:|---:|---:|---:|"]
                      for r in srows:
                          flag = " ⚠️" if (r.get("trades") or 0) < MIN_TRADES else ""
                          L.append(f"| {r.get('value')} | {r.get('trades')}{flag} | "
                                   f"{num(r.get('return_pct'), '{:+.2f}')} | {num(r.get('sharpe'), '{:+.2f}')} | "
                                   f"{num(r.get('max_dd_pct'), '{:.2f}')} | {num(r.get('expectancy_r'))} |")
                      plat = sw.get("plateau") or {}
                      wf = sw.get("walk_forward") or {}
                      dsr = wf.get("deflated_sharpe") or {}
                      pbo = wf.get("pbo") or {}
                      L += ["",
                            f"plateau pick: `{plat.get('chosen')}` "
                            f"(agrees with the best single point: {plat.get('agrees')})",
                            f"walk-forward: in-sample Sharpe {num(wf.get('is_sharpe_mean'), '{:+.2f}')} → "
                            f"out-of-sample {num(wf.get('oos_sharpe'), '{:+.2f}')} · "
                            f"overfit gap {num(wf.get('overfit_gap'), '{:+.2f}')}",
                            f"deflated Sharpe: {num(dsr.get('dsr'), '{:.3f}')} "
                            f"(passes 95%: {dsr.get('pass_95')}) · "
                            f"PBO: {num(pbo.get('pbo'), '{:.2f}')} — {pbo.get('interpretation', '')}",
                            ""]
                      if thin:
                          # Empty or near-empty grid points do not merely add
                          # noise: they change the answer.  Measured on a year of
                          # 60m data, adding 0.90/0.95 (n=0) made the plateau
                          # heuristic reject the n=20 point as a "spike" and pick
                          # an n=5 point instead, and pushed PBO to 0.89.
                          L += [f"> ⚠️ **{len(thin)} of {len(srows)} grid points have n < {MIN_TRADES}** "
                                f"({', '.join(str(t.get('value')) for t in thin)}). Their Sharpe values are "
                                "noise. The CLI computes the plateau, walk-forward and PBO over **all** "
                                "grid points, so those three readings just above are contaminated by these "
                                "rows — read the filtered pick below instead.", ""]
                          kept = [(r.get("value"), r.get("sharpe")) for r in srows
                                  if (r.get("trades") or 0) >= MIN_TRADES]
                          if len(kept) >= 3:
                              try:
                                  from engine import validation as _val
                                  fp = _val.best_plateau(kept, window=1)
                                  L += [f"> **plateau pick over the {len(kept)} grid points with "
                                        f"n ≥ {MIN_TRADES}: `{fp.get('chosen')}`** "
                                        f"(best single point `{fp.get('best_point_value')}`, "
                                        f"agrees: {fp.get('agrees')}, "
                                        f"spikes: {[x.get('value') for x in (fp.get('rows') or []) if x.get('is_spike')]})",
                                        ""]
                              except Exception as exc:
                                  L += [f"> filtered plateau pick unavailable: "
                                        f"{type(exc).__name__}: {exc}", ""]
                          else:
                              L += [f"> filtered plateau pick unavailable: only {len(kept)} grid "
                                    f"point(s) have n ≥ {MIN_TRADES}, and a plateau needs at least 3.",
                                    ""]


                  ab = load(os.path.join(rep, f"real_ablation_{sym}.json"))
                  if ab:
                      base = ab.get("baseline") or {}
                      L += [f"#### {sym} — filter ablation", "",
                            f"baseline: n={base.get('n_trades')} · E[R] {num(base.get('expectancy_r'))} · "
                            f"Sharpe {num(base.get('sharpe'), '{:+.2f}')}", "",
                            "| filter removed | trades | E[R] | Δ E[R] | Δ Sharpe | reading |",
                            "|---|---:|---:|---:|---:|---|"]
                      for name, r in (ab.get("filters") or {}).items():
                          if not isinstance(r, dict):
                              continue
                          # the per-filter numbers live under `detail`; the deltas
                          # are already "without this filter minus baseline"
                          det = r.get("detail") or {}
                          L.append(f"| {name} | {r.get('n_trades')} | "
                                   f"{num(det.get('expectancy_r'))} | "
                                   f"{num(r.get('delta_expectancy_r'))} | "
                                   f"{num(r.get('delta_sharpe'), '{:+.2f}')} | "
                                   f"{r.get('verdict', '')} |")
                      L += ["", "_Δ is (filter removed) − baseline, so a **negative** Δ E[R] "
                            "means the filter was earning money; `harmful` means removing it "
                            "improves the result._", ""]

              if pooled:
                  tot_n = sum(p["n"] for p in pooled)
                  tot_gross = sum(p["gross"] for p in pooled)
                  tot_fric = sum(p["friction"] for p in pooled)
                  tot_net = sum(p["net"] for p in pooled)
                  tot_sig = sum(p["signals"] for p in pooled)
                  tot_fill = sum(p["fills"] for p in pooled)
                  tot_err = sum(p["accounting_errors"] for p in pooled)
                  L += ["### Pooled across symbols", "",
                        "| symbol | trades | return% | maxDD% | win% | E[R] | gross$ | friction$ | net$ |",
                        "|---|---:|---:|---:|---:|---:|---:|---:|---:|"]
                  for p in pooled:
                      L.append(f"| {p['sym']} | {p['n']} | {num(p['return_pct'], '{:+.2f}')} | "
                               f"{num(p['max_dd_pct'], '{:.2f}')} | "
                               f"{num((p['win_rate'] or 0) * 100, '{:.1f}')} | {num(p['expectancy_r'])} | "
                               f"{num(p['gross'], '{:+,.0f}')} | {num(p['friction'], '{:,.0f}')} | "
                               f"{num(p['net'], '{:+,.0f}')} |")
                  w_er = (sum((p["expectancy_r"] or 0.0) * p["n"] for p in pooled) / tot_n) if tot_n else None
                  L += [f"| **pooled** | **{tot_n}** | — | — | — | **{num(w_er)}** | "
                        f"**{tot_gross:+,.0f}** | **{tot_fric:,.0f}** | **{tot_net:+,.0f}** |",
                        "",
                        f"Signals {tot_sig} → fills {tot_fill} → positions {tot_n} · "
                        f"accounting errors **{tot_err}** · "
                        f"friction ÷ gross = {num((tot_fric / tot_gross) if tot_gross else None, '{:.2f}')}",
                        ""]
                  # Pooled E[R] is the trade-count-weighted mean of the per-symbol
                  # expectancies — the right way to pool a per-trade statistic.
                  # It is NOT a portfolio equity curve: each symbol was traded as
                  # its own account, so pooled return%/maxDD are not computed.
                  if tot_n >= POWER_N:
                      L += [f"> ✅ **pooled n = {tot_n} ≥ {POWER_N}** — the study now has 80% power to "
                            "detect a 0.10R per-trade edge, so the pooled E[R] can be read as evidence "
                            "and not only as description. The individual symbols still cannot.", ""]
                  else:
                      L += [f"> ⚠️ pooled n = {tot_n} is still below the ~{POWER_N} trades needed for "
                            "80% power at 0.10R.", ""]
                  if len(pooled) > 1:
                      pos = [p["sym"] for p in pooled if (p["expectancy_r"] or 0.0) > 0]
                      L += [f"> positive E[R] in {len(pos)} of {len(pooled)} symbols"
                            + (f" ({', '.join(pos)})" if pos else "")
                            + ". An edge that appears in only one symbol is a symbol-specific story, "
                              "not an edge.", ""]
                      thin_syms = [p["sym"] for p in pooled if p["n"] < MIN_TRADES]
                      if thin_syms:
                          L += [f"> ⚠️ {', '.join(thin_syms)} contributed fewer than {MIN_TRADES} trades "
                                "and should be dropped from the pooled figure rather than trusted.", ""]

          L += ["---", "",
                "Costs are modelled (commission/funding bps + slippage + sqrt impact), not taken "
                "from a real fee tier or realised fills; and there is no order-book depth model, "
                "so a live position would move the price more than these numbers assume.", ""]
          text = "\n".join(L) + "\n"
          with open(summary, "a") as fh:
              fh.write(text)
          # Also keep a copy inside reports/: the step summary is only visible to
          # signed-in users and disappears with the run after 90 days, whereas a
          # committed file is public, permanent and diffable between runs.
          with open(os.path.join(rep, "REAL_DATA_SUMMARY.md"), "w") as fh:
              fh.write(text)
          print(text[:1200])
          PY
        working-directory: tbae

      # Committing the report back makes the result readable without signing in
      # (job summaries, logs and artifacts are all behind authentication) and
      # gives a permanent, diffable history of every run.  Pushes made with the
      # built-in GITHUB_TOKEN do not trigger a new workflow run, so this cannot
      # loop; the [skip ci] trailer is belt-and-braces for forks and mirrors.
      - name: Publish report to the repository
        if: ${{ always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # Publish only when the study actually produced numbers.  A failed run
          # already announces itself through the ❌ job summary, the ::error::
          # annotation and the artifact — committing an empty report on every
          # outage would just fill the history with noise.
          if ! ls reports/real_*.json >/dev/null 2>&1; then
            echo "nothing to publish (the real-data study produced no reports)"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth=1 origin main
          git checkout -B main origin/main
          stamp=$(date -u +%Y-%m-%dT%H%M%SZ)
          dest="tbae/docs/results/run-${stamp}"
          mkdir -p "$dest"
          cp reports/REAL_DATA_SUMMARY.md "$dest/SUMMARY.md" 2>/dev/null || true
          cp reports/real_*.json "$dest/" 2>/dev/null || true
          cp reports/data_qc.json reports/reachability.txt "$dest/" 2>/dev/null || true
          cp reports/REAL_DATA_SUMMARY.md tbae/docs/results/LATEST.md 2>/dev/null || true
          git add tbae/docs/results
          if git diff --cached --quiet; then
            echo "report unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "research: real-data report ${stamp} [skip ci]"
          git push origin main
        working-directory: "."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-data-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 90
